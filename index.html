  <script>
  // Prepare the reveal before the new page is displayed.
  try {
    const transition = sessionStorage.getItem("pageTransition");

    if (transition) {
      const point = JSON.parse(transition);

      document.documentElement.style.setProperty("--transition-x", point.x + "%");
      document.documentElement.style.setProperty("--transition-y", point.y + "%");
      document.documentElement.classList.add("page-reveal");

      sessionStorage.removeItem("pageTransition");
    }
  } catch (error) {
    // The website will still work if browser storage is unavailable.
  }
</script>

  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
